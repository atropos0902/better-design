name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24.15.0, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm run build -w conform-mcp && npx vitest run --root packages/mcp
      # Trusted publishing: npm checks this workflow's OIDC token, so there is no npm token to store.
      - run: npm publish --provenance --access public -w conform-mcp
