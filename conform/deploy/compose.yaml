services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ../packages/service/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20
  conform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://conform_app@postgres:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_KEY: ${GITHUB_APP_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      RUNNER_OIDC_ISSUER: ${RUNNER_OIDC_ISSUER:-https://token.actions.githubusercontent.com}
      RUNNER_OIDC_AUDIENCE: conform
    ports:
      - "8787:8787"
